<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Plagify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="auth.css" />
    <script>(function(){var t=localStorage.getItem("plagify-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);})();</script>
  </head>
  <body>
    <div class="login-page">
      <header class="site-header">
        <div class="header-inner">
          <a href="index.html" class="logo">
            <span class="logo-mark">P</span>
            <span class="logo-text">PLAGIFY</span>
          </a>
          <nav class="main-nav" id="mainNav">
            <a href="index.html" class="nav-link">Checker</a>
            <a href="index.html#features" class="nav-link">About</a>
            <a href="index.html#faq" class="nav-link">FAQ</a>
          </nav>
          <div class="header-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode" title="Toggle theme">
              <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
              <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
              <span></span>
              <span></span>
              <span></span>
            </button>
          </div>
        </div>
      </header>

      <div class="login-container">
        <a href="index.html" class="back-link">← Back to Plagify</a>

        <div class="login-card">
          <div class="login-brand">
            <div class="brand-mark">P</div>
            <span>PLAGIFY</span>
          </div>

          <div class="login-heading">
            <span>WELCOME BACK</span>
            <h1>Sign in to Plagify</h1>
            <p>Access your plagiarism and AI detection workspace.</p>
          </div>

          <form id="loginForm">
            <div class="input-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" placeholder="you@example.com" required />
            </div>

            <div class="input-group">
              <label for="password">Password</label>
              <div class="password-box">
                <input type="password" id="password" placeholder="Enter your password" required />
                <button type="button" id="showPassword">Show</button>
              </div>
            </div>

            <div class="login-options">
              <label class="remember">
                <input type="checkbox" id="remember" />
                <span>Remember me</span>
              </label>
              <a href="#" id="forgotPassword">Forgot password?</a>
            </div>

            <button type="submit" class="login-button">
              Login to Plagify
              <span>→</span>
            </button>

            <div class="login-message" id="loginMessage"></div>
          </form>

          <p class="login-footer">
            New here?
            <a href="registration.html" id="registerLink">Create an account</a>
          </p>

          <div class="secure-login">
            <span>🔒</span>
            <p>Secure authentication · JWT session</p>
          </div>
        </div>

        <p class="login-footer">© 2026 PLAGIFY</p>
      </div>
    </div>

    <script src="theme.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script>
      const menuToggle = document.getElementById("menuToggle");
      const mainNav = document.getElementById("mainNav");
      if (menuToggle && mainNav) {
        menuToggle.addEventListener("click", () => mainNav.classList.toggle("open"));
      }
    </script>
  </body>
</html>
