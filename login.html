<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login — Plagify</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="auth.css" />
  </head>

  <body>
    <div class="login-page">
      <div class="grid-background"></div>

      <div class="login-container">
        <a href="index.html" class="back-link"> ← Back to Plagify </a>

        <div class="login-card">
          <div class="login-brand">
            <div class="brand-mark">P</div>

            <span>PLAGIFY</span>
          </div>

          <div class="login-heading">
            <span>WELCOME BACK</span>

            <h1>Sign in to Plagify</h1>

            <p>Access your plagiarism and AI detection workspace.</p>
          </div>

          <form id="loginForm">
            <div class="input-group">
              <label for="email"> Email Address </label>

              <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required
              />
            </div>

            <div class="input-group">
              <label for="password"> Password </label>

              <div class="password-box">
                <input
                  type="password"
                  id="password"
                  placeholder="Enter your password"
                  required
                />

                <button type="button" id="showPassword">Show</button>
              </div>
            </div>

            <div class="login-options">
              <label class="remember">
                <input type="checkbox" id="remember" />

                <span>Remember me</span>
              </label>

              <a href="#" id="forgotPassword"> Forgot password? </a>
            </div>

            <button type="submit" class="login-button">
              Login to Plagify
              <span>→</span>
            </button>

            <div class="login-message" id="loginMessage"></div>
          </form>

          <div class="secure-login">
            <span>🔒</span>

            <p>Secure client-side authentication</p>
          </div>
        </div>

        <p class="login-footer">© 2026 PLAGIFY</p>
      </div>
    </div>

    <script src="auth.js"></script>
  </body>
</html>
